      const [classForm, setClassForm] = useState({
        name: "",
        grade: schoolConfig.grades?.[0] || "6",
        studentCount: "40",
        homeroomTeacher: ""
      });

      const resetClassForm = () => {
        setEditingClassId(null);
        setClassForm({
          name: "",
          grade: schoolConfig.grades?.[0] || "6",
          studentCount: "40",
          homeroomTeacher: ""
        });
      };

      const handleEditClassClick = (cl) => {
        setEditingClassId(cl.id);
        setClassForm({
          name: cl.name || "",
          grade: cl.grade || "6",
          studentCount: String(cl.studentCount ?? ""),
          homeroomTeacher: cl.homeroomTeacher || ""
        });
      };

      const handleSaveClassForm = async (e) => {
        e.preventDefault();
        const trimmedName = classForm.name.trim();
        if (!trimmedName) return;

        const isDuplicate = classes.some(
          (cl) => cl.name.toLowerCase() === trimmedName.toLowerCase() && cl.id !== editingClassId
        );
        if (isDuplicate) {
          notify(`Tên lớp "${trimmedName}" đã tồn tại!`, true);
          return;
        }

        if (editingClassId) {
          const oldClass = classes.find((cl) => cl.id === editingClassId);
          const oldName = oldClass?.name;
          const updatedClass = {
            ...oldClass,
            name: trimmedName,
            grade: classForm.grade,
            studentCount: Number(classForm.studentCount) || 0,
            homeroomTeacher: classForm.homeroomTeacher.trim()
          };
          setClasses((prev) => prev.map((cl) => (cl.id === editingClassId ? updatedClass : cl)));
          await syncDoc("classes", editingClassId, updatedClass);

          if (oldName && oldName !== trimmedName) {
            setRegistrations((prev) =>
              prev.map((r) => {
                if (!r.members.some((m) => m.className === oldName)) return r;
                const updReg = {
                  ...r,
                  members: r.members.map((m) => (m.className === oldName ? { ...m, className: trimmedName, grade: classForm.grade } : m))
                };
                syncDoc("registrations", r.id, updReg);
                return updReg;
              })
            );
            setResults((prev) =>
              prev.map((res) => {
                if (!res.members.some((m) => m.className === oldName)) return res;
                const updRes = {
                  ...res,
                  members: res.members.map((m) => (m.className === oldName ? { ...m, className: trimmedName, grade: classForm.grade } : m))
                };
                syncDoc("results", res.id, updRes);
                return updRes;
              })
            );
          }

          notify(`Đã cập nhật thông tin lớp "${trimmedName}"!`);
          resetClassForm();
        } else {
          const newClass = {
            id: `cls_${Date.now()}`,
            name: trimmedName,
            grade: classForm.grade,
            studentCount: Number(classForm.studentCount) || 0,
            homeroomTeacher: classForm.homeroomTeacher.trim()
          };
          setClasses((prev) => [...prev, newClass]);
          await syncDoc("classes", newClass.id, newClass);
          notify(`Đã thêm lớp mới "${trimmedName}"!`);
          resetClassForm();
        }
      };

      const handleDeleteClass = (cl) => {
        setConfirmBox({
          title: "Xác nhận xóa lớp học",
          message: `Bạn có chắc chắn muốn xóa lớp "${cl.name}" khỏi hệ thống?`,
          confirmLabel: "Xóa lớp",
          onConfirm: async () => {
            setClasses((prev) => prev.filter((item) => item.id !== cl.id));
            await deleteDocRemote("classes", cl.id);
            if (editingClassId === cl.id) resetClassForm();
            notify(`Đã xóa lớp "${cl.name}".`);
          }
        });
      };

      const filteredAdminRegistrations = useMemo(() => {
        return registrations.filter((r) => regFilterContest === "ALL" || r.contestId === regFilterContest);
      }, [registrations, regFilterContest]);

      const handleRegistrationStatusChange = async (reg, nextStatus) => {
        if (nextStatus === "REJECTED") {
          const targetName = reg.type === "TEAM" ? `Đội ${reg.teamName}` : reg.members[0]?.fullName;
          setConfirmBox({
            title: "Từ chối & Xóa hồ sơ đăng ký",
            message: `Bạn chọn "Từ chối" đối với "${targetName}". Hồ sơ này sẽ bị xóa khỏi danh sách đăng ký. Xác nhận thực hiện?`,
            confirmLabel: "Từ chối & Xóa luôn",
            onConfirm: async () => {
              setRegistrations((prev) => prev.filter((item) => item.id !== reg.id));
              await deleteDocRemote("registrations", reg.id);
              notify(`Đã từ chối và xóa hồ sơ của "${targetName}".`);
            }
          });
          return;
        }
        const updated = { ...reg, status: nextStatus };
        setRegistrations((prev) => prev.map((item) => (item.id === reg.id ? updated : item)));
        await syncDoc("registrations", reg.id, updated);
        notify("Đã cập nhật trạng thái thí sinh!");
      };

      // Các cuộc thi sắp đến hạn nộp báo cáo cấp trên trong <= 3 ngày hoặc quá hạn
      const dueReports = useMemo(() => {
        return contests
          .map((c) => ({ contest: c, info: getReportReminderInfo(c) }))
          .filter((item) => item.info && (item.info.status === "DUE_SOON" || item.info.status === "OVERDUE"));
      }, [contests]);

      const handleMarkReportSubmitted = async (contest) => {
        const updated = { ...contest, reportSubmitted: true };
        setContests((prev) => prev.map((c) => (c.id === contest.id ? updated : c)));
        await syncDoc("contests", contest.id, { reportSubmitted: true });
        notify(`Đã đánh dấu hoàn thành nộp báo cáo lên cấp trên cho "${contest.title}"!`);
      };

      const resetContestForm = () => {
        setEditingContestId(null);
        setContestForm({
          title: "",
          organizer: schoolConfig.schoolName,
          level: "Cấp Trường",
          field: "Khoa học & Sáng tạo",
          gradesText: "6, 7, 8, 9",
          format: "Cá nhân & Đội",
          registrationEnd: "2026-12-20",
          thoiHan: "Hạn đăng ký: 20/12/2026",
          reportDeadline: "",
          location: schoolConfig.schoolName,
          description: ""
        });
      };

      const handleEditContestClick = (c) => {
        setEditingContestId(c.id);
        setContestForm({
          title: c.title || "",
          organizer: c.organizer || "",
          level: c.level || "Cấp Trường",
          field: c.field || "Khoa học & Sáng tạo",
          gradesText: (c.grades || ["6", "7", "8", "9"]).join(", "),
          format: c.format || "Cá nhân & Đội",
          registrationEnd: c.registrationEnd || "2026-12-20",
          thoiHan: c.thoiHan || "",
          reportDeadline: c.reportDeadline || "",
          location: c.location || schoolConfig.schoolName,
          description: c.description || ""
        });
      };

      const handleSaveContestForm = async (e) => {
        e.preventDefault();
        if (!contestForm.title.trim()) return;
        const parsedGrades = contestForm.gradesText.split(",").map((g) => g.trim()).filter(Boolean);

        if (editingContestId) {
          const existing = contests.find((c) => c.id === editingContestId);
          const updated = {
            ...existing,
            title: contestForm.title.trim(),
            organizer: contestForm.organizer.trim(),
            level: contestForm.level,
            field: contestForm.field.trim(),
            grades: parsedGrades.length ? parsedGrades : ["6", "7", "8", "9"],
            format: contestForm.format.trim(),
            registrationEnd: contestForm.registrationEnd,
            schoolInternalDeadline: contestForm.registrationEnd,
            thoiHan: contestForm.thoiHan.trim(),
            reportDeadline: contestForm.reportDeadline,
            location: contestForm.location.trim(),
            description: contestForm.description.trim()
          };
          setContests((prev) => prev.map((c) => (c.id === editingContestId ? updated : c)));
          await syncDoc("contests", editingContestId, updated);
          notify("Đã cập nhật thông tin cuộc thi!");
          resetContestForm();
        } else {
          const created = {
            id: `contest_${Date.now()}`,
            title: contestForm.title.trim(),
            academicYear: schoolConfig.academicYear,
            organizer: contestForm.organizer.trim() || schoolConfig.schoolName,
            level: contestForm.level,
            field: contestForm.field.trim() || "Khoa học & Sáng tạo",
            grades: parsedGrades.length ? parsedGrades : ["6", "7", "8", "9"],
            format: contestForm.format.trim() || "Cá nhân & Đội",
            publishStatus: "PUBLISHED",
            workflowStatus: "OPEN_REGISTRATION",
            registrationEnd: contestForm.registrationEnd,
            schoolInternalDeadline: contestForm.registrationEnd,
            reportDeadline: contestForm.reportDeadline,
            reportSubmitted: false,
            thoiHan: contestForm.thoiHan.trim() || `Hạn đăng ký: ${contestForm.registrationEnd}`,
            location: contestForm.location.trim() || schoolConfig.schoolName,
            contactInfo: `${schoolConfig.contactPerson} - SĐT: ${schoolConfig.contactPhone}`,
            description: contestForm.description.trim() || "Cuộc thi dành cho học sinh THCS.",
            studentArticle: `Mở đăng ký ${contestForm.title.trim()}. ${contestForm.thoiHan}. Liên hệ: ${schoolConfig.contactPerson} (${schoolConfig.contactPhone}).`,
            pdfRule: { version: "v1.0", fileName: "The_le.pdf", updatedAt: new Date().toISOString().slice(0, 10), summaryPages: ["Trang 1: Thông tin cuộc thi."] },
            rounds: [{ id: `r_${Date.now()}`, name: "Vòng thi chính thức", date: contestForm.registrationEnd, time: "08:00", location: contestForm.location || schoolConfig.schoolName, pic: schoolConfig.contactPerson }]
          };
          setContests((prev) => [created, ...prev]);
          await syncDoc("contests", created.id, created);
          notify("Đã tạo và công bố cuộc thi mới!");
          resetContestForm();
        }
      };

      const handleDeleteContest = (contest) => {
        setConfirmBox({
          title: "Xác nhận xóa cuộc thi",
          message: `Bạn có chắc chắn muốn xóa cuộc thi "${contest.title}" khỏi hệ thống? Thao tác này không thể hoàn tác.`,
          confirmLabel: "Xóa cuộc thi",
          onConfirm: async () => {
            setContests((prev) => prev.filter((c) => c.id !== contest.id));
            await deleteDocRemote("contests", contest.id);
            if (editingContestId === contest.id) resetContestForm();
            notify("Đã xóa cuộc thi!");
          }
        });
      };

      // Xử lý tải ảnh học sinh lên Bảng vàng
      const handleStudentPhotoUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await resizeImageToDataUrl(file, 320);
          setHofForm((prev) => ({ ...prev, photoUrl: dataUrl }));
          notify("Đã tải ảnh học sinh lên biểu mẫu!");
        } catch (err) {
          notify("Không thể đọc tệp ảnh, vui lòng chọn ảnh JPG/PNG khác.", true);
        }
      };

      const resetHofForm = () => {
        setEditingResultId(null);
        setHofForm({
          contestId: contests[0]?.id || "contest_ioe",
          type: "INDIVIDUAL",
          teamName: "",
          fullName: "",
          className: classes[0]?.name || "8A",
          photoUrl: "",
          score: "100",
          prize: "Nhất",
          notes: "",
          isPublished: true
        });
      };

      const handleEditResultClick = (res) => {
        setEditingResultId(res.id);
        setHofForm({
          contestId: res.contestId,
          type: res.type || "INDIVIDUAL",
          teamName: res.teamName || "",
          fullName: res.members.map((m) => m.fullName).join(", "),
          className: res.members[0]?.className || "8A",
          photoUrl: res.members[0]?.photoUrl || "",
          score: String(res.score ?? ""),
          prize: res.prize || "Nhất",
          notes: res.notes || "",
          isPublished: Boolean(res.isPublished)
        });
      };

      const handleSaveResultHof = async (e) => {
        e.preventDefault();
        if (!hofForm.fullName.trim()) return;
        const clsObj = classes.find((c) => c.name === hofForm.className);
        const names = hofForm.type === "TEAM"
          ? hofForm.fullName.split(",").map((n) => n.trim()).filter(Boolean)
          : [hofForm.fullName.trim()];

        const membersArr = names.map((nm, idx) => ({
          studentId: `st_hof_${Date.now()}_${idx}`,
          fullName: nm,
          className: hofForm.className,
          grade: clsObj?.grade || hofForm.className.charAt(0),
          photoUrl: idx === 0 ? hofForm.photoUrl : ""
        }));

        if (editingResultId) {
          const updated = {
            id: editingResultId,
            contestId: hofForm.contestId,
            type: hofForm.type,
            teamName: hofForm.type === "TEAM" ? hofForm.teamName.trim() : "",
            members: membersArr,
            score: Number(hofForm.score) || 0,
            prize: hofForm.prize,
            notes: hofForm.notes.trim(),
            isPublished: hofForm.isPublished
          };
          setResults((prev) => prev.map((r) => (r.id === editingResultId ? updated : r)));
          await syncDoc("results", editingResultId, updated);
          notify("Đã cập nhật kết quả & Bảng vàng vinh danh!");
          resetHofForm();
        } else {
          const created = {
            id: `res_${Date.now()}`,
            contestId: hofForm.contestId,
            type: hofForm.type,
            teamName: hofForm.type === "TEAM" ? hofForm.teamName.trim() : "",
            members: membersArr,
            score: Number(hofForm.score) || 0,
            prize: hofForm.prize,
            notes: hofForm.notes.trim(),
            isPublished: hofForm.isPublished
          };
          setResults((prev) => [created, ...prev]);
          await syncDoc("results", created.id, created);
          notify("Đã thêm thành tích mới lên Kết quả & Bảng vàng vinh danh!");
          resetHofForm();
        }
      };

      const handleDeleteResult = (res) => {
        setConfirmBox({
          title: "Xác nhận xóa kết quả / vinh danh",
          message: `Bạn có chắc chắn muốn xóa thành tích của "${res.members.map((m) => m.fullName).join(", ")}" khỏi Kết quả và Bảng vàng?`,
          confirmLabel: "Xóa thành tích",
          onConfirm: async () => {
            setResults((prev) => prev.filter((r) => r.id !== res.id));
            await deleteDocRemote("results", res.id);
            if (editingResultId === res.id) resetHofForm();
            notify("Đã xóa kết quả & mục Bảng vàng!");
          }
        });
      };

      // Xử lý tải file PDF và gọi Gemini AI thật
      const handlePdfUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setPdfFileName(file.name);
        setIsAnalyzingPdf(true);
        try {
          const pdfData = await extractFullTextFromPdf(file);
          const aiJson = await callGeminiAnalyzePdf({
            rawText: pdfData.fullText,
            fileName: file.name,
            docType,
            schoolConfig,
            apiKey: geminiApiKey
          });
          setAiExtracted({

                  </div>
                  <div>
                    <label className="font-bold block mb-1">Năm học</label>
                    <input type="text" value={schoolConfig.academicYear} onChange={(e) => setSchoolConfig({ ...schoolConfig, academicYear: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Cán bộ phụ trách</label>
                    <input type="text" value={schoolConfig.contactPerson} onChange={(e) => setSchoolConfig({ ...schoolConfig, contactPerson: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Số điện thoại liên hệ</label>
                    <input type="text" value={schoolConfig.contactPhone} onChange={(e) => setSchoolConfig({ ...schoolConfig, contactPhone: e.target.value })} className="w-full p-2.5 rounded-xl border border-slate-300 font-bold" />
                  </div>
                  <div className="sm:col-span-2 lg:col-span-4">
                    <label className="font-bold text-blue-800 block mb-1">Gemini API Key (Dùng khi chạy web thật trên GitHub / Vercel / Netlify)</label>
                    <input
                      type="password"
                      value={geminiApiKey}
                      onChange={(e) => setGeminiApiKey(e.target.value)}
                      placeholder="Dán khóa AIzaSy... của Google AI Studio vào đây (nếu chạy ngoài môi trường xem trước)"
                      className="w-full p-2.5 rounded-xl border border-blue-300 bg-blue-50/40 font-mono"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                  <div className="text-slate-600">
                    <strong>Đóng gói & Sao lưu dữ liệu:</strong> Xuất toàn bộ dữ liệu cuộc thi, thí sinh, kết quả Bảng vàng ra tệp JSON để lưu trữ hoặc chuyển sang máy tính khác.
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        const backup = { schoolConfig, classes, contests, registrations, results, announcements, exportedAt: new Date().toISOString() };
                        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `Sao_luu_Cong_cuoc_thi_${schoolConfig.academicYear}.json`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        notify("Đã tải xuống gói sao lưu dữ liệu (.json)!");
                      }}
                      className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold"
                    >
                      Xuất gói sao lưu (.json)
                    </button>
                    <label className="px-4 py-2 rounded-xl border border-slate-300 hover:bg-slate-50 font-bold text-slate-700 cursor-pointer">
                      Khôi phục từ file (.json)
                      <input
                        type="file"
                        accept=".json"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (!file) return;
                          const reader = new FileReader();
                          reader.onload = (ev) => {
                            try {
                              const data = JSON.parse(ev.target.result);
                              if (data.schoolConfig) setSchoolConfig(data.schoolConfig);
                              if (data.classes) setClasses(data.classes);
                              if (data.contests) setContests(data.contests);
                              if (data.registrations) setRegistrations(data.registrations);
                              if (data.results) setResults(data.results);
                              if (data.announcements) setAnnouncements(data.announcements);
                              notify("Đã khôi phục toàn bộ dữ liệu từ bản sao lưu!");
                            } catch (err) {
                              notify("Tệp sao lưu không hợp lệ!", true);
                            }
                          };
                          reader.readAsText(file);
                        }}
                      />
                    </label>
                  </div>
                </div>
              </div>

              {/* Quản lý Danh sách Lớp học: Tạo lớp mới, Sửa tên lớp, Sĩ số & Xóa lớp */}
              <div className="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h3 className="font-extrabold text-base text-slate-900">Quản lý danh sách lớp học ({classes.length} lớp)</h3>
                    <p className="text-slate-500">Thêm lớp mới, chỉnh sửa tên lớp, sĩ số hoặc giáo viên chủ nhiệm cho năm học {schoolConfig.academicYear}</p>
                  </div>
                  {editingClassId && (
                    <button type="button" onClick={resetClassForm} className="px-3 py-1.5 rounded-xl bg-slate-200 text-slate-700 font-bold">
                      Hủy sửa lớp
                    </button>
                  )}
                </div>

                <form onSubmit={handleSaveClassForm} className={`p-4 rounded-xl border grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 ${editingClassId ? "bg-amber-50/70 border-amber-300" : "bg-slate-50 border-slate-200"}`}>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tên lớp *</label>
                    <input
                      type="text"
                      required
                      value={classForm.name}
                      onChange={(e) => setClassForm({ ...classForm, name: e.target.value })}
                      placeholder="VD: 6B, 8C..."
                      className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Khối lớp</label>
                    <select
                      value={classForm.grade}
                      onChange={(e) => setClassForm({ ...classForm, grade: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold"
                    >
                      {schoolConfig.grades.map((g) => (
                        <option key={g} value={g}>Khối {g}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Sĩ số học sinh</label>
                    <input
                      type="number"
                      min="1"
                      max="100"
                      value={classForm.studentCount}
                      onChange={(e) => setClassForm({ ...classForm, studentCount: e.target.value })}
                      placeholder="VD: 40"
                      className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-bold"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Giáo viên chủ nhiệm</label>
                    <input
                      type="text"
                      value={classForm.homeroomTeacher}
                      onChange={(e) => setClassForm({ ...classForm, homeroomTeacher: e.target.value })}
                      placeholder="VD: Cô Nguyễn Thị Mai"
                      className="w-full p-2.5 rounded-xl border border-slate-300 bg-white"
                    />
                  </div>
                  <div className="flex items-end">
                    <button
                      type="submit"
                      className={`w-full p-2.5 rounded-xl text-white font-extrabold ${editingClassId ? "bg-amber-600 hover:bg-amber-700" : "bg-blue-600 hover:bg-blue-700"}`}
                    >
                      {editingClassId ? "Lưu sửa lớp" : "+ Tạo lớp mới"}
                    </button>
                  </div>
                </form>

                <div className="overflow-x-auto border border-slate-200 rounded-xl">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 font-bold text-slate-700">
                      <tr>
                        <th className="p-3">Tên lớp</th>
                        <th className="p-3">Khối</th>
                        <th className="p-3">Sĩ số</th>
                        <th className="p-3">Giáo viên chủ nhiệm</th>
                        <th className="p-3">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {classes.map((cl) => (
                        <tr key={cl.id} className="hover:bg-slate-50">
                          <td className="p-3 font-extrabold text-blue-800">Lớp {cl.name}</td>
                          <td className="p-3 font-semibold">Khối {cl.grade}</td>
                          <td className="p-3 font-bold">{cl.studentCount || 0} học sinh</td>
                          <td className="p-3 text-slate-600">{cl.homeroomTeacher || "Chưa phân công"}</td>
                          <td className="p-3">
                            <div className="flex items-center gap-1.5">
                              <button
                                type="button"
                                onClick={() => handleEditClassClick(cl)}
                                className="px-2.5 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-950 font-bold"
                              >
                                Sửa
                              </button>
                              <button
                                type="button"
                                onClick={() => handleDeleteClass(cl)}
                                className="px-2.5 py-1.5 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold"
                              >
                                Xóa
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
