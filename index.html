    function sortContestsOngoingFirst(list) {
      return [...list].sort((a, b) => {
        const pA = PRIORITY_ORDER[a.workflowStatus] || 99;
        const pB = PRIORITY_ORDER[b.workflowStatus] || 99;
        if (pA !== pB) return pA - pB;
        return (a.registrationEnd || "9999-12-31").localeCompare(b.registrationEnd || "9999-12-31");
      });
    }

    function getContestSituation(c) {
      if (c.publishStatus === "ARCHIVED" || c.workflowStatus === "RESULTS_PUBLISHED") return "ENDED";
      if (c.workflowStatus === "UPCOMING") return "UPCOMING";
      return "ONGOING";
    }

    // Tính số ngày còn lại đến hạn nộp báo cáo cấp trên (Nhắc trước 3 ngày)
    function getReportReminderInfo(contest) {
      if (!contest.reportDeadline) return null;
      if (contest.reportSubmitted) {
        return { status: "COMPLETED", label: `Đã nộp báo cáo (${contest.reportDeadline})`, daysLeft: null };
      }
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(contest.reportDeadline + "T00:00:00");
      const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) {
        return { status: "OVERDUE", label: `Quá hạn nộp báo cáo ${Math.abs(diffDays)} ngày (${contest.reportDeadline})`, daysLeft: diffDays };
      }
      if (diffDays <= 3) {
        return {
          status: "DUE_SOON",
          label: diffDays === 0 ? `Hôm nay là hạn chót nộp báo cáo (${contest.reportDeadline})` : `Sắp đến hạn nộp báo cáo: còn ${diffDays} ngày (${contest.reportDeadline})`,
          daysLeft: diffDays
        };
      }
      return { status: "NORMAL", label: `Hạn nộp báo cáo: ${contest.reportDeadline} (còn ${diffDays} ngày)`, daysLeft: diffDays };
    }

    // Nén ảnh học sinh tải lên (resize tối đa 320px)
    function resizeImageToDataUrl(file, maxWidth = 320) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.82));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // 3. TÍCH HỢP GEMINI AI THẬT (ĐỌC PDF THỂ LỆ & TRẢ LỜI CHATBOX)
    // =========================================================================
    async function extractFullTextFromPdf(file) {
      if (!window.pdfjsLib) throw new Error("Thư viện PDF.js chưa tải xong.");
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageStr = textContent.items.map((item) => item.str).join(" ").trim();
        pages.push({ page: i, text: pageStr || "[Trang ảnh quét không có lớp văn bản]" });
      }
      return {
        totalPages: pdf.numPages,
        pages,
        fullText: pages.map((p) => `--- TRANG ${p.page} ---\n${p.text}`).join("\n\n")
      };
    }

    async function callGeminiAnalyzePdf({ rawText, fileName, docType, schoolConfig, apiKey }) {
      const effectiveKey = (apiKey || DEFAULT_GEMINI_API_KEY || "").trim();
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveKey}`;

      const systemPrompt = `Bạn là chuyên gia giáo dục và trợ lý hành chính của ${schoolConfig.schoolName} (năm học ${schoolConfig.academicYear}). Hãy đọc kỹ nội dung văn bản trích xuất từ tệp PDF (${docType === "THE_LE" ? "Thể lệ cuộc thi" : "Thông báo lịch thi"}) và trích xuất chính xác các trường dữ liệu theo JSON schema. Nếu mục nào không có trong văn bản, ghi "Chưa nêu trong tài liệu". Không tự bịa giờ thi nếu tài liệu chỉ ghi ngày. Soạn thêm một bài thông báo ngắn gọn, rõ ràng dành cho học sinh THCS (kèm thông tin liên hệ ${schoolConfig.contactPerson} - SĐT: ${schoolConfig.contactPhone}).`;

      const payload = {
        contents: [
          {
            role: "user",
            parts: [{ text: `Tên tệp: ${fileName}\n\nNội dung văn bản PDF:\n${rawText.slice(0, 28000)}` }]
          }
        ],
        systemInstruction: { parts: [{ text: systemPrompt }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              contestName: { type: "STRING" },
              organizer: { type: "STRING" },
              level: { type: "STRING" },
              targetGrades: { type: "ARRAY", items: { type: "STRING" } },
              format: { type: "STRING" },
              registrationDeadlineISO: { type: "STRING" },
              preliminaryDateISO: { type: "STRING" },
              finalDateISO: { type: "STRING" },
              thoiHanSummary: { type: "STRING" },
              submissionRules: { type: "STRING" },
              milestones: {
                type: "ARRAY",
                items: {
                  type: "OBJECT",
                  properties: {
                    name: { type: "STRING" },
                    dateText: { type: "STRING" },
                    pageRef: { type: "STRING" }
                  }
                }
              },
              studentArticle: { type: "STRING" }
            },
            required: ["contestName", "organizer", "level", "format", "thoiHanSummary", "milestones", "studentArticle"]
          }
        }
      };

      const delays = [1000, 2000, 4000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const resp = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!resp.ok) {
            if (resp.status === 429 && attempt < delays.length) {
              await new Promise((r) => setTimeout(r, delays[attempt]));
              continue;
            }
            throw new Error(`HTTP ${resp.status}`);
          }
          const data = await resp.json();
          const textPart = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!textPart) throw new Error("Phản hồi Gemini trống");
          return JSON.parse(textPart);
        } catch (err) {
          if (attempt === delays.length) throw err;
          await new Promise((r) => setTimeout(r, delays[attempt]));
        }
      }
    }

    async function callGeminiChatAssistant({ userMessage, contests, schoolConfig, apiKey }) {
      const effectiveKey = (apiKey || DEFAULT_GEMINI_API_KEY || "").trim();
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${effectiveKey}`;

      const contestContext = contests
        .map((c) => `- ${c.title} (${c.level}, Khối ${c.grades.join(",")}, Hình thức: ${c.format}, Thời hạn: ${c.thoiHan}, Hạn ĐK: ${c.registrationEnd})`)
        .join("\n");

      const systemPrompt = `Bạn là Trợ lý AI chính thức của Cổng quản lý cuộc thi học sinh ${schoolConfig.schoolName} (năm học ${schoolConfig.academicYear}). Hãy trả lời ngắn gọn, thân thiện, chính xác bằng tiếng Việt cho học sinh và phụ huynh dựa trên danh sách cuộc thi hiện hành sau:\n${contestContext}\n\nLuôn nhắc nếu cần hỗ trợ trực tiếp hoặc xác nhận đặc biệt thì liên hệ ${schoolConfig.contactPerson} qua số điện thoại ${schoolConfig.contactPhone}.`;

      const payload = {
        contents: [{ role: "user", parts: [{ text: userMessage }] }],
        systemInstruction: { parts: [{ text: systemPrompt }] }
      };

      const resp = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
    }

    // =========================================================================
    // 4. TIỆN ÍCH XUẤT EXCEL (CSV UTF-8) & TẢI PDF THỂ LỆ
    // =========================================================================
    function downloadCSV(filename, headers, rows) {
      const esc = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = "\uFEFF" + [headers.map(esc).join(","), ...rows.map((r) => r.map(esc).join(","))].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadRulePDF(contest, schoolName) {
      const ascii = (s) =>
        String(s || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .replace(/Đ/g, "D")
          .replace(/[^\x20-\x7E]/g, "");

      const lines = [
        `THE LE / THONG BAO CUOC THI - ${ascii(schoolName).toUpperCase()}`,
        `Ten cuoc thi: ${ascii(contest.title)}`,
        `Don vi to chuc: ${ascii(contest.organizer)} (${ascii(contest.level)})`,
        `Doi tuong: Khoi ${contest.grades.join(", ")} | Hinh thuc: ${ascii(contest.format)}`,
        `Thoi han: ${ascii(contest.thoiHan)}`,
        `Lien he phu trach: ${ascii(contest.contactInfo)}`,
        `----------------------------------------------------`,
        ...(contest.pdfRule?.summaryPages || []).map((p) => ascii(p))
      ];
      let y = 760;
      const cmds = lines
        .map((l) => {
          const c = `BT /F1 11 Tf 45 ${y} Td (${l.replace(/\(/g, "[").replace(/\)/g, "]")}) Tj ET`;
          y -= 22;
          return c;
        })
        .join("\n");

      const pdf = `%PDF-1.4\n1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n3 0 obj << /Type /Page /Parent 2 0 R /Resources << /Font << /F1 4 0 R >> >> /MediaBox [0 0 612 792] /Contents 5 0 R >> endobj\n4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n5 0 obj << /Length ${cmds.length} >> stream\n${cmds}\nendstream endobj\nxref\n0 6\n0000000000 65535 f \n0000000009 00000 n \n0000000058 00000 n \n0000000115 00000 n \n0000000229 00000 n \n0000000297 00000 n \ntrailer << /Size 6 /Root 1 0 R >>\nstartxref\n${350 + cmds.length}\n%%EOF`;
      const blob = new Blob([pdf], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = contest.pdfRule?.fileName || "The_le_cuoc_thi.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

                <div className="w-10 h-10 rounded-xl bg-blue-700 text-white font-black flex items-center justify-center shadow-sm">
                  {schoolConfig.logoText}
                </div>
                <div>
                  <div className="font-extrabold text-sm sm:text-base text-slate-900">{schoolConfig.schoolName}</div>
                  <div className="text-xs text-blue-700 font-semibold">Cổng quản lý cuộc thi học sinh</div>
                </div>
              </button>

              <nav className="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm">
                {[
                  { id: "HOME", label: "Trang chủ" },
                  { id: "CONTESTS", label: "Cuộc thi" },
                  { id: "SCHEDULE", label: "Lịch thi" },
                  { id: "ANNOUNCEMENTS", label: "Thông báo" },
                  { id: "RESULTS", label: "Kết quả" },
                  { id: "HALL_OF_FAME", label: "Bảng vàng" }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-3 py-2 rounded-xl font-bold transition ${
                      activeTab === item.id || (item.id === "CONTESTS" && activeTab === "DETAIL")
                        ? "bg-blue-50 text-blue-700"
                        : "text-slate-600 hover:bg-slate-100"
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
                {isAdmin && (
                  <button
                    onClick={() => setActiveTab("MANAGE")}
                    className={`px-3.5 py-2 rounded-xl font-extrabold flex items-center gap-1.5 ${
                      activeTab === "MANAGE" ? "bg-blue-700 text-white" : "bg-blue-950 text-amber-300"
                    }`}
                  >
                    <span>Quản trị & AI</span>
                    {urgentReportContests.length > 0 && (
                      <span className="px-1.5 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-black">
                        {urgentReportContests.length}
                      </span>
                    )}
                  </button>
                )}
              </nav>
            </div>
          </header>

          {/* Nội dung chính */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {activeTab === "HOME" && (
              <HomePage
                schoolConfig={schoolConfig}
                contests={contests}
                announcements={announcements}
                results={results}
                onOpenContest={(id) => { setSelectedContestId(id); setActiveTab("DETAIL"); }}
                onNavigate={setActiveTab}
                onOpenPdf={setPdfPreviewContest}
              />
            )}

            {activeTab === "CONTESTS" && (
              <ContestsPage
                schoolConfig={schoolConfig}
                contests={contests}
                onOpenContest={(id) => { setSelectedContestId(id); setActiveTab("DETAIL"); }}
                onOpenPdf={setPdfPreviewContest}
              />
            )}

            {activeTab === "DETAIL" && (
              <ContestDetailPage
                contest={contests.find((c) => c.id === selectedContestId) || contests[0]}
                schoolConfig={schoolConfig}
                classes={classes}
                registrations={registrations}
                onBack={() => setActiveTab("CONTESTS")}
                onOpenPdf={setPdfPreviewContest}
                onRegister={async (newReg) => {
                  const item = { ...newReg, id: `reg_${Date.now()}`, createdAt: new Date().toISOString().slice(0, 10) };
                  setRegistrations((prev) => [item, ...prev]);
                  await syncDoc("registrations", item.id, item);
                  notify("Đã gửi đăng ký dự thi thành công! Hồ sơ đang chờ nhà trường duyệt.");
                }}
              />
            )}

            {activeTab === "SCHEDULE" && (
              <SchedulePage contests={contests} schoolConfig={schoolConfig} onOpenContest={(id) => { setSelectedContestId(id); setActiveTab("DETAIL"); }} />
            )}

            {activeTab === "ANNOUNCEMENTS" && (
              <AnnouncementsPage announcements={announcements} contests={contests} onOpenContest={(id) => { setSelectedContestId(id); setActiveTab("DETAIL"); }} />
            )}

            {activeTab === "RESULTS" && (
              <ResultsPage contests={contests} results={results} classes={classes} />
            )}

            {activeTab === "HALL_OF_FAME" && (
              <HallOfFamePage
                contests={contests}
                results={results}
                classes={classes}
                schoolConfig={schoolConfig}
                onExport={() => {
                  const pub = results.filter((r) => r.isPublished);
                  downloadCSV(
                    `Bang_vang_${schoolConfig.academicYear}.csv`,
                    ["Họ và tên", "Lớp", "Cuộc thi", "Giải thưởng", "Điểm", "Hình thức"],
                    pub.flatMap((r) => {
                      const cTitle = contests.find((c) => c.id === r.contestId)?.title || "";
                      return r.members.map((m) => [m.fullName, m.className, cTitle, r.prize, r.score, r.type === "TEAM" ? `Đội: ${r.teamName}` : "Cá nhân"]);
                    })

                  notify("Đã xuất danh sách Bảng vàng ra file Excel!");
                }}
              />
            )}

            {activeTab === "MANAGE" && isAdmin && (
              <AdminDashboard
                schoolConfig={schoolConfig}
                setSchoolConfig={setSchoolConfig}
                geminiApiKey={geminiApiKey}
                setGeminiApiKey={setGeminiApiKey}
                classes={classes}
                setClasses={setClasses}
                contests={contests}
                setContests={setContests}
                registrations={registrations}
                setRegistrations={setRegistrations}
                results={results}
                setResults={setResults}
                announcements={announcements}
                setAnnouncements={setAnnouncements}
                syncDoc={syncDoc}
                deleteDocRemote={deleteDocRemote}
                notify={notify}
                setConfirmBox={setConfirmBox}
                onOpenPdf={setPdfPreviewContest}
              />

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 mt-10">
            <div className="max-w-7xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
              <div>
                <strong className="text-slate-800">{schoolConfig.schoolName}</strong> · Năm học {schoolConfig.academicYear} · Phụ trách: <strong>{schoolConfig.contactPerson}</strong> ({schoolConfig.contactPhone})

              {!isAdmin && (
                <button onClick={() => setShowLoginModal(true)} className="text-blue-700 font-bold hover:underline">
                  Đăng nhập quản trị
                </button>
              )}
            </div>
          </footer>

          {/* Chatbox Trao đổi & Trợ lý AI Gemini */}
          <div className="fixed bottom-4 right-4 z-40">
            {chatOpen ? (
              <div className="w-[340px] sm:w-[380px] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[490px]">
                <div className="bg-blue-950 text-white px-4 py-3 flex items-center justify-between">
                  <div>
                    <div className="font-bold text-xs sm:text-sm">Trao đổi & Trợ lý AI Cuộc thi</div>
                    <div className="text-[11px] text-amber-300">{schoolConfig.contactPerson} · {schoolConfig.contactPhone}</div>
                  </div>
                  <button onClick={() => setChatOpen(false)} className="text-blue-200 hover:text-white font-bold text-sm">✕</button>
                </div>
                <div className="p-3 bg-slate-50 flex-1 overflow-y-auto space-y-2.5 min-h-[240px] max-h-[300px]">
                  {chatMessages.map((m) => (
                    <div key={m.id} className={`flex flex-col ${m.isAdmin ? "items-start" : "items-end"}`}>
                      <div className={`max-w-[85%] rounded-2xl px-3.5 py-2 text-xs ${m.isAdmin ? "bg-blue-50 border border-blue-200 text-slate-800" : "bg-blue-600 text-white"}`}>
                        <div className={`text-[10px] font-bold mb-0.5 ${m.isAdmin ? "text-blue-800" : "text-blue-100"}`}>{m.senderName}</div>
                        <p className="whitespace-pre-line leading-relaxed">{m.text}</p>
                        <div className="text-[9px] opacity-70 mt-1 text-right">{m.time}</div>
                      </div>
                    </div>
                  ))}
                  {isAiReplying && (
                    <div className="text-[11px] text-blue-700 font-semibold italic">Trợ lý AI Gemini đang tra cứu thể lệ và trả lời...</div>
                  )}
                </div>
                <form onSubmit={handleSendChat} className="p-2.5 bg-white border-t border-slate-200 space-y-1.5">
                  {!isAdmin && (
                    <input
                      type="text"
                      value={chatName}
                      onChange={(e) => setChatName(e.target.value)}
                      placeholder="Tên học sinh / Lớp (VD: Minh Khôi - 8A)"
                      className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs bg-slate-50"
                    />
                  )}
                  <div className="flex gap-1.5">
                    <input
                      type="text"
                      required
                      value={chatText}
                      onChange={(e) => setChatText(e.target.value)}
                      placeholder={isAdmin ? "Nhập phản hồi quản trị..." : "Hỏi AI hoặc Phụ trách kỹ thuật về cuộc thi..."}
                      className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-xs"
                    />
                    <button type="submit" className="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs">
                      Gửi
                    </button>
                  </div>
                </form>
              </div>
            ) : (
              <button onClick={() => setChatOpen(true)} className="px-4 py-3 rounded-full bg-blue-700 hover:bg-blue-800 text-white shadow-xl border-2 border-white text-left">
                <div className="text-xs font-extrabold">Trao đổi / Hỏi đáp AI</div>
                <div className="text-[10px] text-blue-100">{schoolConfig.contactPerson} · {schoolConfig.contactPhone}</div>
              </button>
            )}
          </div>

          {/* Modal Đăng nhập Quản trị (Gọn gàng: chỉ Tài khoản & Mật khẩu) */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/65 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <h3 className="text-base font-extrabold text-slate-900">Đăng nhập quản trị</h3>
                  <button onClick={() => setShowLoginModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <form onSubmit={handleAdminLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tài khoản</label>
                    <input type="text" required value={loginUser} onChange={(e) => setLoginUser(e.target.value)} placeholder="Nhập tài khoản" className="w-full px-3 py-2.5 border border-slate-300 rounded-xl" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Mật khẩu</label>
                    <input type="password" required value={loginPass} onChange={(e) => setLoginPass(e.target.value)} placeholder="Nhập mật khẩu" className="w-full px-3 py-2.5 border border-slate-300 rounded-xl" />
                  </div>
                  <div className="flex justify-end gap-2 pt-1">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-700">Hủy</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold">Đăng nhập</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // TRANG CHỦ
    // =========================================================================
    function HomePage({ schoolConfig, contests, announcements, results, onOpenContest, onNavigate, onOpenPdf }) {
      const published = sortContestsOngoingFirst(contests.filter((c) => c.publishStatus === "PUBLISHED"));
      const featured = results.filter((r) => r.isPublished).slice(0, 4);

      return (
        <div className="space-y-8">
          <section className="rounded-3xl bg-gradient-to-r from-blue-900 via-blue-800 to-blue-700 text-white p-6 sm:p-10 shadow-lg space-y-4">
            <span className="inline-block px-3 py-1 rounded-full bg-amber-400/20 border border-amber-300/40 text-amber-300 text-xs font-bold">
              Năm học {schoolConfig.academicYear} · Khối {schoolConfig.grades.join(", ")}
            </span>
            <h1 className="text-2xl sm:text-4xl font-extrabold leading-tight max-w-2xl">
              Cổng thông tin & Đăng ký cuộc thi học sinh {schoolConfig.schoolName}
            </h1>
            <p className="text-blue-100 text-sm max-w-2xl">
              Tra cứu thể lệ PDF, đăng ký dự thi cá nhân hoặc theo đội, theo dõi lịch thi và Bảng vàng vinh danh. Phụ trách: <strong className="text-amber-300">{schoolConfig.contactPerson} ({schoolConfig.contactPhone})</strong>.
            </p>
            <div className="flex flex-wrap gap-3 pt-2">
              <button onClick={() => onNavigate("CONTESTS")} className="px-5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-blue-950 font-extrabold text-sm">
                Xem danh sách cuộc thi
              </button>
              <button onClick={() => onNavigate("HALL_OF_FAME")} className="px-5 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 text-white font-bold text-sm border border-white/25">
                Bảng vàng & Xếp hạng lớp
              </button>
            </div>
          </section>

          <section className="space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg sm:text-xl font-extrabold text-slate-900">Cuộc thi đang diễn ra & Mở đăng ký</h2>
              <button onClick={() => onNavigate("CONTESTS")} className="text-xs sm:text-sm font-bold text-blue-700 hover:underline">Xem tất cả →</button>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {published.slice(0, 3).map((c) => {
                const wf = WORKFLOW_META[c.workflowStatus] || WORKFLOW_META.UPCOMING;
                return (
                  <div key={c.id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col justify-between gap-4">
                    <div className="space-y-2.5">
                      <div className="flex items-center justify-between gap-2">
                        <span className="px-2.5 py-0.5 rounded-lg bg-blue-50 text-blue-700 text-xs font-bold">{c.level}</span>
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-bold border ${wf.badge}`}>{wf.label}</span>
                      </div>
                      <h3 className="font-extrabold text-base text-slate-900">{c.title}</h3>
                      {c.thoiHan && (
                        <div className="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold">
                          ⏱ {c.thoiHan}
                        </div>
                      )}
                      <p className="text-xs text-slate-600">Khối {c.grades.join(", ")} · {c.format}</p>
                    </div>
                    <div className="flex gap-2 pt-3 border-t border-slate-100">
                      <button onClick={() => onOpenContest(c.id)} className="flex-1 py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs">
                        Chi tiết & Đăng ký
                      </button>
                      <button onClick={() => onOpenPdf(c)} className="py-2 px-3 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs">
                        Thể lệ PDF
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          <section className="bg-gradient-to-br from-amber-50 via-white to-blue-50 rounded-3xl border border-amber-200 p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-extrabold text-slate-900">Gương mặt tiêu biểu trên Bảng vàng</h2>
              <button onClick={() => onNavigate("HALL_OF_FAME")} className="px-3.5 py-2 rounded-xl bg-amber-400 text-blue-950 font-extrabold text-xs">Xem Bảng vàng</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              {featured.map((r) => {
                const firstPhoto = r.members.find((m) => m.photoUrl)?.photoUrl;
                return (
                  <div key={r.id} className="bg-white rounded-2xl p-4 border border-amber-200 shadow-xs space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="px-2.5 py-0.5 rounded-full bg-amber-400 text-blue-950 font-extrabold text-xs">Giải {r.prize}</span>
                      <span className="text-xs font-bold text-blue-700">Lớp {r.members.map((m) => m.className).join(" & ")}</span>
                    </div>
                    <div className="flex items-center gap-3 pt-1">
                      {firstPhoto ? (
                        <img src={firstPhoto} alt="Học sinh" className="w-11 h-11 rounded-full object-cover border border-amber-300 shrink-0" />
                      ) : (
                        <div className="w-11 h-11 rounded-full bg-blue-100 text-blue-800 font-black text-xs flex items-center justify-center shrink-0">
                          {r.members[0]?.fullName?.slice(0, 2).toUpperCase()}
                        </div>
                      )}
                      <div>
                        <div className="font-extrabold text-sm text-slate-900">{r.members.map((m) => m.fullName).join(", ")}</div>
                        <p className="text-xs text-slate-500 line-clamp-1">{contests.find((c) => c.id === r.contestId)?.title}</p>

                    </div>
                  </div>
                );
              })}

          </section>
        </div>

    // =========================================================================
    // DANH SÁCH CUỘC THI (TÌM KIẾM + LỌC THỜI GIAN, KHỐI, TÌNH TRẠNG)
    // =========================================================================
    function ContestsPage({ schoolConfig, contests, onOpenContest, onOpenPdf }) {
      const [keyword, setKeyword] = useState("");
      const [filterGrade, setFilterGrade] = useState("ALL");
      const [filterMonth, setFilterMonth] = useState("ALL");
      const [filterSituation, setFilterSituation] = useState("ALL");

      const availableMonths = useMemo(() => {
        const set = new Set();
        contests.forEach((c) => {
          if (c.registrationEnd) set.add(c.registrationEnd.slice(0, 7));
          (c.rounds || []).forEach((r) => { if (r.date) set.add(r.date.slice(0, 7)); });
        });
        return Array.from(set).sort();
      }, [contests]);

      const filteredContests = useMemo(() => {
        const list = contests
          .filter((c) => c.publishStatus === "PUBLISHED")
          .filter((c) => {
            if (keyword.trim()) {
              const q = keyword.toLowerCase();
              const matchTitle = c.title.toLowerCase().includes(q);
              const matchOrg = (c.organizer || "").toLowerCase().includes(q);
              if (!matchTitle && !matchOrg) return false;
            }
            if (filterGrade !== "ALL" && !c.grades.includes(filterGrade)) return false;
            if (filterSituation !== "ALL" && getContestSituation(c) !== filterSituation) return false;
            if (filterMonth !== "ALL") {
              const matchReg = (c.registrationEnd || "").startsWith(filterMonth);
              const matchRound = (c.rounds || []).some((r) => (r.date || "").startsWith(filterMonth));
              if (!matchReg && !matchRound) return false;
            }
            return true;
          });
        return sortContestsOngoingFirst(list);
      }, [contests, keyword, filterGrade, filterMonth, filterSituation]);

      return (
        <div className="space-y-6">
          <div>
            <h1 className="text-2xl font-extrabold text-slate-900">Danh sách cuộc thi học sinh</h1>
            <p className="text-sm text-slate-600">Tìm kiếm nhanh và lọc cuộc thi theo thời gian, khối lớp và tình trạng tổ chức</p>
          </div>

          {/* Thanh tìm kiếm & Bộ lọc */}
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs space-y-3">
            <input
              type="text"
              value={keyword}
              onChange={(e) => setKeyword(e.target.value)}
              placeholder="Tìm kiếm cuộc thi theo tên hoặc đơn vị tổ chức..."
              className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm"
            />
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
              <div>
                <label className="block font-bold text-slate-600 mb-1">Lọc theo thời gian (Tháng)</label>
                <select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-semibold">
                  <option value="ALL">Tất cả thời gian</option>
                  {availableMonths.map((m) => (
                    <option key={m} value={m}>Tháng {m.slice(5, 7)}/{m.slice(0, 4)}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-600 mb-1">Lọc theo khối lớp</label>
                <select value={filterGrade} onChange={(e) => setFilterGrade(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-semibold">
                  <option value="ALL">Tất cả các khối</option>
                  {schoolConfig.grades.map((g) => <option key={g} value={g}>Khối {g}</option>)}
                </select>
              </div>
              <div>
                <label className="block font-bold text-slate-600 mb-1">Lọc theo tình trạng</label>
                <select value={filterSituation} onChange={(e) => setFilterSituation(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-300 bg-white font-semibold">
                  <option value="ALL">Tất cả tình trạng</option>
                  <option value="ONGOING">Đang diễn ra</option>
                  <option value="UPCOMING">Sắp diễn ra</option>
                  <option value="ENDED">Đã kết thúc</option>
                </select>
              </div>
            </div>
          </div>

          {/* Danh sách thẻ cuộc thi */}
          {filteredContests.length === 0 ? (
            <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">
              Không tìm thấy cuộc thi nào phù hợp với bộ lọc hiện tại.
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              {filteredContests.map((c) => {
                const wf = WORKFLOW_META[c.workflowStatus] || WORKFLOW_META.UPCOMING;
                const sit = SITUATION_META[getContestSituation(c)];
                return (
                  <div key={c.id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs flex flex-col justify-between gap-4">
                    <div className="space-y-3">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-1.5">
                          <span className={`px-2.5 py-0.5 rounded-md text-[11px] font-extrabold ${sit.badge}`}>{sit.label}</span>
                          <span className="px-2.5 py-0.5 rounded-md bg-blue-50 text-blue-700 text-xs font-bold">{c.level}</span>
                        </div>
                        <span className={`px-2.5 py-0.5 rounded-lg text-xs font-bold border ${wf.badge}`}>{wf.label}</span>
                      </div>
                      <h2 className="text-lg font-extrabold text-slate-900">{c.title}</h2>
                      <p className="text-xs text-slate-600">{c.description}</p>
                      {c.thoiHan && (
                        <div className="p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-bold">
                          ⏱ {c.thoiHan}
                        </div>
                      )}
                      <div className="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div><span className="text-slate-500">Khối dự thi:</span> <strong>Khối {c.grades.join(", ")}</strong></div>
                        <div><span className="text-slate-500">Hình thức:</span> <strong>{c.format}</strong></div>
                        <div><span className="text-slate-500">Hạn trường:</span> <strong className="text-blue-700">{c.schoolInternalDeadline || c.registrationEnd}</strong></div>
                        <div><span className="text-slate-500">Hạn BTC:</span> <strong>{c.registrationEnd}</strong></div>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
                      <button onClick={() => onOpenContest(c.id)} className="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs">
                        Chi tiết & Đăng ký dự thi
                      </button>
                      <button onClick={() => onOpenPdf(c)} className="py-2.5 px-3 rounded-xl border border-slate-300 text-slate-700 font-bold text-xs">
                        Xem PDF
                      </button>
                      <button onClick={() => downloadRulePDF(c, schoolConfig.schoolName)} className="py-2.5 px-3 rounded-xl bg-amber-400 text-blue-950 font-bold text-xs">
                        Tải PDF
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // CHI TIẾT CUỘC THI & FORM ĐĂNG KÝ DỰ THI (CÁ NHÂN / THEO ĐỘI)
    // =========================================================================
    function ContestDetailPage({ contest, schoolConfig, classes, registrations, onBack, onOpenPdf, onRegister }) {
      const [showForm, setShowForm] = useState(false);
      const [regType, setRegType] = useState("INDIVIDUAL");

      // Form cá nhân
      const [indName, setIndName] = useState("");
      const [indClass, setIndClass] = useState(classes[0]?.name || "8A");
      const [indDob, setIndDob] = useState("");
      const [indPhone, setIndPhone] = useState("");
      const [indNote, setIndNote] = useState("");

      // Form theo đội
      const [teamName, setTeamName] = useState("");
      const [teamProject, setTeamProject] = useState("");
      const [teamPhone, setTeamPhone] = useState("");
      const [teamMembers, setTeamMembers] = useState([
        { fullName: "", className: classes[0]?.name || "8A", dob: "" },
        { fullName: "", className: classes[1]?.name || "8B", dob: "" }
      ]);

      if (!contest) return null;
      const contestRegs = registrations.filter((r) => r.contestId === contest.id);
      const isClosed = contest.workflowStatus === "RESULTS_PUBLISHED" || contest.workflowStatus === "CLOSED_REGISTRATION";

      const updateMember = (idx, field, val) => {
        setTeamMembers((prev) => prev.map((m, i) => (i === idx ? { ...m, [field]: val } : m)));
      };

      const addMemberSlot = () => {
        if (teamMembers.length >= 5) return;
        setTeamMembers((prev) => [...prev, { fullName: "", className: classes[0]?.name || "8A", dob: "" }]);
      };

      const removeMemberSlot = (idx) => {
        if (teamMembers.length <= 2) return;
        setTeamMembers((prev) => prev.filter((_, i) => i !== idx));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (regType === "INDIVIDUAL") {
          if (!indName.trim()) return;
          const clsObj = classes.find((c) => c.name === indClass);
          onRegister({
            contestId: contest.id,
            type: "INDIVIDUAL",
            teamName: "",
            members: [{
              studentId: `st_${Date.now()}`,
              fullName: indName.trim(),
              className: indClass,
              grade: clsObj?.grade || indClass.charAt(0),
              dob: indDob,
              phone: indPhone.trim()
            }],
            status: "PENDING",
            note: indNote.trim()
          });
          setIndName("");
          setIndDob("");
          setIndPhone("");
          setIndNote("");
        } else {
          const validMembers = teamMembers.filter((m) => m.fullName.trim());
          if (!teamName.trim() || validMembers.length < 2) return;
          onRegister({
            contestId: contest.id,
            type: "TEAM",
            teamName: teamName.trim(),
            members: validMembers.map((m, i) => {
              const clsObj = classes.find((c) => c.name === m.className);
              return {
                studentId: `st_${Date.now()}_${i}`,
                fullName: m.fullName.trim(),
                className: m.className,
                grade: clsObj?.grade || m.className.charAt(0),
                dob: m.dob,
                phone: i === 0 ? teamPhone.trim() : ""
              };
            }),
            status: "PENDING",
            note: teamProject.trim()
          });
          setTeamName("");
          setTeamProject("");
          setTeamPhone("");
        }
        setShowForm(false);
      };

      return (
        <div className="space-y-6">
          <button onClick={onBack} className="text-xs sm:text-sm font-bold text-blue-700 hover:underline">
            ← Quay lại danh sách cuộc thi
          </button>

          <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-xs space-y-6">
            <div className="flex flex-col lg:flex-row lg:items-start justify-between gap-4 border-b border-slate-100 pb-5">
              <div className="space-y-2">
                <div className="flex flex-wrap gap-2">
                  <span className="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 text-xs font-bold">{contest.level}</span>
                  <span className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">{contest.field}</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">{contest.title}</h1>
                <p className="text-sm text-slate-600">{contest.description}</p>
              </div>
              <div className="flex flex-wrap gap-2 shrink-0">
                <button onClick={() => onOpenPdf(contest)} className="px-4 py-2.5 rounded-xl bg-blue-50 text-blue-800 border border-blue-200 font-bold text-xs">
                  Xem thể lệ PDF
                </button>
                <button onClick={() => downloadRulePDF(contest, schoolConfig.schoolName)} className="px-4 py-2.5 rounded-xl bg-amber-400 text-blue-950 font-bold text-xs">
                  Tải thể lệ PDF
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                <span className="text-slate-500 font-bold">Đơn vị tổ chức & Đối tượng</span>
                <p className="font-extrabold text-sm text-slate-900">{contest.organizer}</p>
                <p className="text-slate-600">Khối {contest.grades.join(", ")} · {contest.format}</p>
              </div>
              <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 space-y-1">
                <span className="text-amber-800 font-bold">Mốc thời hạn</span>
                <p className="font-extrabold text-sm text-amber-950">{contest.thoiHan}</p>
                <p className="text-amber-900">Hạn trường: {contest.schoolInternalDeadline || contest.registrationEnd} · BTC: {contest.registrationEnd}</p>
              </div>
              <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                <span className="text-slate-500 font-bold">Địa điểm & Liên hệ</span>
                <p className="font-extrabold text-sm text-slate-900">{contest.location}</p>
                <p className="text-slate-600">{contest.contactInfo}</p>
              </div>
            </div>

            <div className="p-5 rounded-2xl bg-blue-50/60 border border-blue-100 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <h2 className="font-extrabold text-base text-slate-900">Thông báo & Hướng dẫn tham gia</h2>
                {!isClosed && (
                  <button onClick={() => setShowForm(!showForm)} className="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs shadow-sm">
                    {showForm ? "Đóng biểu mẫu" : "+ Đăng ký dự thi ngay"}
                  </button>
                )}
              </div>
              <p className="text-sm text-slate-700 whitespace-pre-line leading-relaxed">{contest.studentArticle}</p>
            </div>

            {/* Form Đăng ký dự thi dành cho học sinh (Cá nhân & Theo đội) */}
            {showForm && !isClosed && (
              <form onSubmit={handleSubmit} className="bg-blue-950 text-white rounded-2xl p-6 space-y-4 shadow-xl">
                <div className="flex items-center justify-between border-b border-blue-800 pb-3">
                  <h3 className="font-extrabold text-base text-amber-300">Biểu mẫu đăng ký dự thi trực tuyến</h3>
                  <button type="button" onClick={() => setShowForm(false)} className="text-blue-200 hover:text-white font-bold">✕</button>
                </div>

                {/* Chọn hình thức Cá nhân hoặc Theo đội */}
                <div className="flex gap-2 text-xs">
                  <button
                    type="button"
                    onClick={() => setRegType("INDIVIDUAL")}
                    className={`flex-1 py-2.5 px-4 rounded-xl font-extrabold border ${regType === "INDIVIDUAL" ? "bg-amber-400 text-blue-950 border-amber-400" : "bg-blue-900 text-white border-blue-700"}`}
                  >
                    Đăng ký Cá nhân
                  </button>
                  <button
                    type="button"
                    onClick={() => setRegType("TEAM")}
                    className={`flex-1 py-2.5 px-4 rounded-xl font-extrabold border ${regType === "TEAM" ? "bg-amber-400 text-blue-950 border-amber-400" : "bg-blue-900 text-white border-blue-700"}`}
                  >
                    Đăng ký Theo đội (Nhiều thành viên)
                  </button>
                </div>

                {regType === "INDIVIDUAL" ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="block text-blue-200 font-bold mb-1">Họ và tên học sinh *</label>
                      <input type="text" required value={indName} onChange={(e) => setIndName(e.target.value)} placeholder="VD: Nguyễn Văn An" className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-semibold" />
                    </div>
                    <div>
                      <label className="block text-blue-200 font-bold mb-1">Lớp *</label>
                      <select value={indClass} onChange={(e) => setIndClass(e.target.value)} className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-bold">
                        {classes.map((cl) => <option key={cl.id} value={cl.name}>Lớp {cl.name} (Khối {cl.grade})</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-blue-200 font-bold mb-1">Ngày sinh</label>
                      <input type="date" value={indDob} onChange={(e) => setIndDob(e.target.value)} className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-semibold" />
                    </div>
                    <div>
                      <label className="block text-blue-200 font-bold mb-1">Số điện thoại liên hệ (HS hoặc Phụ huynh) *</label>
                      <input type="tel" required value={indPhone} onChange={(e) => setIndPhone(e.target.value)} placeholder="VD: 0987654321" className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-semibold" />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block text-blue-200 font-bold mb-1">Bảng thi / Nội dung đăng ký / Ghi chú</label>
                      <input type="text" value={indNote} onChange={(e) => setIndNote(e.target.value)} placeholder="VD: Bảng B lập trình Python, hoặc số báo danh IOE..." className="w-full p-2.5 rounded-xl bg-white text-slate-900" />
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-blue-200 font-bold mb-1">Tên đội thi *</label>
                        <input type="text" required value={teamName} onChange={(e) => setTeamName(e.target.value)} placeholder="VD: Đội Sáng Tạo 8A-8B" className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-bold" />
                      </div>
                      <div>
                        <label className="block text-blue-200 font-bold mb-1">Tên đề tài / Sản phẩm</label>
                        <input type="text" value={teamProject} onChange={(e) => setTeamProject(e.target.value)} placeholder="VD: Phần mềm học Toán" className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-semibold" />
                      </div>
                      <div>
                        <label className="block text-blue-200 font-bold mb-1">SĐT liên hệ đội trưởng *</label>
                        <input type="tel" required value={teamPhone} onChange={(e) => setTeamPhone(e.target.value)} placeholder="VD: 0987654321" className="w-full p-2.5 rounded-xl bg-white text-slate-900 font-semibold" />
                      </div>
                    </div>

                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-amber-300">Danh sách thành viên trong đội (Tối thiểu 2 thành viên, hỗ trợ liên lớp):</span>
                        {teamMembers.length < 5 && (
                          <button type="button" onClick={addMemberSlot} className="px-2.5 py-1 rounded-lg bg-blue-800 hover:bg-blue-700 text-amber-300 font-bold">
                            + Thêm thành viên
                          </button>
                        )}
                      </div>
                      {teamMembers.map((m, idx) => (
                        <div key={idx} className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-blue-900/60 p-2.5 rounded-xl border border-blue-800 items-center">
                          <div className="sm:col-span-5">
                            <input
                              type="text"
                              required
                              value={m.fullName}
                              onChange={(e) => updateMember(idx, "fullName", e.target.value)}
                              placeholder={`Họ tên thành viên ${idx + 1} *`}
                              className="w-full p-2 rounded-lg bg-white text-slate-900 font-semibold"
                            />
                          </div>
                          <div className="sm:col-span-3">
                            <select value={m.className} onChange={(e) => updateMember(idx, "className", e.target.value)} className="w-full p-2 rounded-lg bg-white text-slate-900 font-bold">
                              {classes.map((cl) => <option key={cl.id} value={cl.name}>Lớp {cl.name}</option>)}
                            </select>
                          </div>
                          <div className="sm:col-span-3">
                            <input type="date" value={m.dob} onChange={(e) => updateMember(idx, "dob", e.target.value)} className="w-full p-2 rounded-lg bg-white text-slate-900" />
                          </div>
                          <div className="sm:col-span-1 text-right">
                            {teamMembers.length > 2 && (
                              <button type="button" onClick={() => removeMemberSlot(idx)} className="px-2 py-1 rounded bg-rose-600 text-white font-bold">✕</button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setShowForm(false)} className="px-4 py-2 rounded-xl bg-blue-900 text-blue-200 text-xs font-bold">Hủy</button>
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-blue-950 text-xs font-extrabold">
                    Hoàn tất & Gửi đăng ký
                  </button>
                </div>
              </form>
            )}

            {/* Danh sách thí sinh / đội đã đăng ký */}
            <div className="space-y-3">
              <h3 className="font-extrabold text-base text-slate-900">Danh sách đã đăng ký tham gia ({contestRegs.length})</h3>
              <div className="overflow-x-auto border border-slate-200 rounded-2xl">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 border-b border-slate-200 font-bold text-slate-700">
                    <tr>
                      <th className="p-3">Thí sinh / Đội thi</th>
                      <th className="p-3">Lớp</th>
                      <th className="p-3">Hình thức</th>
                      <th className="p-3">Ghi chú / Đề tài</th>
                      <th className="p-3">Trạng thái</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {contestRegs.map((r) => (
                      <tr key={r.id}>
                        <td className="p-3 font-bold text-slate-900">
                          {r.type === "TEAM" ? `[Đội] ${r.teamName} (${r.members.map((m) => m.fullName).join(", ")})` : r.members[0]?.fullName}
                        </td>
                        <td className="p-3 font-bold text-blue-700">{[...new Set(r.members.map((m) => m.className))].join(" & ")}</td>
                        <td className="p-3">{r.type === "TEAM" ? "Theo đội" : "Cá nhân"}</td>
                        <td className="p-3 text-slate-500">{r.note || "—"}</td>
                        <td className="p-3">
                          <span className={`px-2.5 py-0.5 rounded-full font-bold ${r.status === "ATTENDED" ? "bg-emerald-50 text-emerald-700" : r.status === "APPROVED" ? "bg-blue-50 text-blue-700" : "bg-amber-50 text-amber-800"}`}>
                            {r.status === "ATTENDED" ? "Đã dự thi" : r.status === "APPROVED" ? "Đã duyệt" : "Chờ duyệt"}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // LỊCH THI, THÔNG BÁO, KẾT QUẢ, BẢNG VÀNG
    // =========================================================================
    function SchedulePage({ contests, schoolConfig, onOpenContest }) {
      const [grade, setGrade] = useState("ALL");
      const events = contests
        .filter((c) => c.publishStatus === "PUBLISHED" && (grade === "ALL" || c.grades.includes(grade)))
        .flatMap((c) => (c.rounds || []).map((r) => ({ ...r, contestId: c.id, contestTitle: c.title })))
        .sort((a, b) => a.date.localeCompare(b.date));

      return (
        <div className="space-y-5">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <h1 className="text-2xl font-extrabold text-slate-900">Lịch thi các vòng</h1>
            <select value={grade} onChange={(e) => setGrade(e.target.value)} className="p-2.5 rounded-xl border border-slate-300 bg-white text-xs font-bold">
              <option value="ALL">Tất cả khối</option>
              {schoolConfig.grades.map((g) => <option key={g} value={g}>Khối {g}</option>)}
            </select>
          </div>
          <div className="space-y-3">
            {events.map((ev) => (
              <div key={ev.id} onClick={() => onOpenContest(ev.contestId)} className="bg-white p-4 rounded-2xl border border-slate-200 hover:border-blue-400 cursor-pointer flex items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="px-3 py-2 rounded-xl bg-blue-900 text-white text-center min-w-[72px]">
                    <div className="text-[10px] text-amber-300 font-bold">{ev.date.slice(0, 7)}</div>
                    <div className="text-lg font-black">{ev.date.slice(8, 10)}</div>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-blue-700">{ev.contestTitle}</div>
                    <div className="font-extrabold text-sm sm:text-base">{ev.name}</div>
                    <div className="text-xs text-slate-500">{ev.time} · {ev.location}</div>
                  </div>
                </div>
                <span className="text-xs font-bold text-blue-700">Chi tiết →</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AnnouncementsPage({ announcements, contests, onOpenContest }) {
      return (
        <div className="space-y-4">
          <h1 className="text-2xl font-extrabold text-slate-900">Thông báo cuộc thi</h1>
          {announcements.map((a) => (
            <div key={a.id} className="bg-white rounded-2xl border border-slate-200 p-5 space-y-2.5">
              <div className="flex items-center gap-2 text-xs">
                {a.isPinned && <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-900 font-bold">Ghim</span>}
                {a.isScheduleChange && <span className="px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold">Đổi lịch thi</span>}
                <span className="text-slate-400 ml-auto">{a.updatedAt}</span>
              </div>
              <h2 className="font-extrabold text-base text-slate-900">{a.title}</h2>
              <p className="text-sm text-slate-700">{a.content}</p>
              {a.isScheduleChange && (
                <div className="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs space-y-1">
                  <div className="line-through text-slate-500">Lịch cũ: {a.oldSchedule}</div>
                  <div className="font-bold text-rose-800">Lịch mới: {a.newSchedule}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    function ResultsPage({ contests, results, classes }) {
      const [cFilter, setCFilter] = useState("ALL");
      const [clsFilter, setClsFilter] = useState("ALL");
      const list = results.filter((r) => r.isPublished && (cFilter === "ALL" || r.contestId === cFilter) && (clsFilter === "ALL" || r.members.some((m) => m.className === clsFilter)));

      return (
        <div className="space-y-5">
          <h1 className="text-2xl font-extrabold text-slate-900">Tra cứu kết quả đã công bố</h1>
          <div className="bg-white p-4 rounded-2xl border border-slate-200 flex flex-wrap gap-3 text-xs">
            <select value={cFilter} onChange={(e) => setCFilter(e.target.value)} className="p-2.5 rounded-xl border border-slate-300 font-bold">
              <option value="ALL">Tất cả cuộc thi</option>
              {contests.map((c) => <option key={c.id} value={c.id}>{c.title}</option>)}
            </select>
            <select value={clsFilter} onChange={(e) => setClsFilter(e.target.value)} className="p-2.5 rounded-xl border border-slate-300 font-bold">
              <option value="ALL">Tất cả lớp</option>
              {classes.map((cl) => <option key={cl.id} value={cl.name}>Lớp {cl.name}</option>)}
            </select>
          </div>
          <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
            <table className="w-full text-left text-xs sm:text-sm">
              <thead className="bg-blue-950 text-white font-bold">
                <tr>
                  <th className="p-3.5">Thí sinh / Đội</th>
                  <th className="p-3.5">Lớp</th>
                  <th className="p-3.5">Cuộc thi</th>
                  <th className="p-3.5">Điểm</th>
                  <th className="p-3.5">Giải thưởng</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {list.map((r) => (
                  <tr key={r.id}>
                    <td className="p-3.5 font-bold">{r.type === "TEAM" ? `[Đội] ${r.teamName} (${r.members.map((m) => m.fullName).join(", ")})` : r.members[0]?.fullName}</td>

                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function HallOfFamePage({ contests, results, classes, schoolConfig, onExport }) {
      const pub = results.filter((r) => r.isPublished);

      const leaderboard = useMemo(() => {
        const map = {};
        classes.forEach((cl) => { map[cl.name] = { className: cl.name, points: 0, count: 0 }; });
        pub.forEach((r) => {
          const pts = schoolConfig.scoringRules?.[r.prize] || 0;
          const clsList = [...new Set(r.members.map((m) => m.className))];
          const share = r.type === "TEAM" && schoolConfig.teamScoringMode === "SPLIT_EVENLY" ? Number((pts / clsList.length).toFixed(2)) : pts;
          clsList.forEach((cn) => {
            if (map[cn]) {
              map[cn].points = Number((map[cn].points + share).toFixed(2));
              map[cn].count += 1;
            }
          });
        });
        const sorted = Object.values(map).sort((a, b) => b.points - a.points);
        let rank = 1;
        return sorted.map((item, idx) => {
          if (idx > 0 && item.points < sorted[idx - 1].points) rank = idx + 1;
          return { ...item, rank };
        });
      }, [pub, classes, schoolConfig]);

      const honorees = pub.flatMap((r) =>
        r.members.map((m) => ({
          id: `${r.id}_${m.studentId || m.fullName}`,
          fullName: m.fullName,
          className: m.className,
          photoUrl: m.photoUrl || "",
          prize: r.prize,
          notes: r.notes || "",
          contestTitle: contests.find((c) => c.id === r.contestId)?.title || "",
          note: r.type === "TEAM" ? `Đội ${r.teamName}` : "Cá nhân"
        }))
      );

      return (
        <div className="space-y-8">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900">Bảng vàng & Xếp hạng thi đua lớp</h1>
              <p className="text-xs text-slate-600">Nhất {schoolConfig.scoringRules["Nhất"]}đ · Nhì {schoolConfig.scoringRules["Nhì"]}đ · Ba {schoolConfig.scoringRules["Ba"]}đ · KK {schoolConfig.scoringRules["Khuyến khích"]}đ (Giải đội liên lớp chia đều điểm, đồng hạng khi bằng điểm)</p>
            </div>
            <button onClick={onExport} className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs">Xuất Excel Bảng vàng</button>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto">
            <table className="w-full text-left text-xs sm:text-sm">
              <thead className="bg-slate-50 border-b border-slate-200 font-bold">
                <tr>
                  <th className="p-3.5">Hạng</th>
                  <th className="p-3.5">Lớp</th>
                  <th className="p-3.5">Số giải</th>
                  <th className="p-3.5">Tổng điểm</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {leaderboard.map((row) => (
                  <tr key={row.className} className={row.rank === 1 ? "bg-amber-50/60" : ""}>
                    <td className="p-3.5 font-black">#{row.rank}</td>
                    <td className="p-3.5 font-extrabold">Lớp {row.className}</td>
                    <td className="p-3.5">{row.count} giải</td>
                    <td className="p-3.5 font-black text-blue-700">{row.points} điểm</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {honorees.map((h) => (
              <div key={h.id} className="bg-gradient-to-br from-white to-amber-50/60 rounded-2xl border border-amber-200 p-4 space-y-2.5 shadow-xs">
                <div className="flex items-center justify-between">
                  <span className="px-2.5 py-0.5 rounded-full bg-amber-400 text-blue-950 font-black text-xs">Giải {h.prize}</span>
                  <span className="text-xs font-bold text-blue-800">Lớp {h.className}</span>
                </div>
                <div className="flex items-center gap-3">
                  {h.photoUrl ? (
                    <img src={h.photoUrl} alt={h.fullName} className="w-14 h-14 rounded-2xl object-cover border-2 border-amber-300 shadow-xs shrink-0" />
                  ) : (
                    <div className="w-14 h-14 rounded-2xl bg-blue-100 text-blue-800 font-black text-sm flex items-center justify-center border border-blue-200 shrink-0">
                      {h.fullName.slice(0, 2).toUpperCase()}
                    </div>
                  )}
                  <div className="min-w-0">
                    <div className="font-extrabold text-base text-slate-900 truncate">{h.fullName}</div>
                    <div className="text-xs font-semibold text-blue-700 line-clamp-1">{h.contestTitle}</div>
                    <div className="text-[11px] text-slate-500 mt-0.5">{h.note}{h.notes ? ` · ${h.notes}` : ""}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // =========================================================================
    // KHU VỰC QUẢN TRỊ VIÊN (NHẮC BÁO CÁO 3 NGÀY, AI GEMINI PDF, THÊM/SỬA/XÓA)
    // =========================================================================
    function AdminDashboard({
      schoolConfig, setSchoolConfig, geminiApiKey, setGeminiApiKey, classes, setClasses,
      contests, setContests, registrations, setRegistrations,

    }) {
      const [adminTab, setAdminTab] = useState("AI_PDF");

      const [pdfFileName, setPdfFileName] = useState("");

      const [aiExtracted, setAiExtracted] = useState(null);

      // State Tạo & Sửa Cuộc thi + Hạn nộp báo cáo cấp trên
      const [editingContestId, setEditingContestId] = useState(null);
      const [contestForm, setContestForm] = useState({

      // State Thêm & Sửa Kết quả / Bảng vàng vinh danh (kèm ảnh học sinh)
      const [editingResultId, setEditingResultId] = useState(null);
      const [hofForm, setHofForm] = useState({
        contestId: contests[0]?.id || "contest_ioe",
        type: "INDIVIDUAL",
        teamName: "",
        fullName: "",
        className: classes[0]?.name || "8A",
        photoUrl: "",
        score: "100",
        prize: "Nhất",
        notes: "",
        isPublished: true
      });

      // State Lọc duyệt đăng ký theo cuộc thi
      const [regFilterContest, setRegFilterContest] = useState("ALL");

      // State Quản lý Lớp học (Tạo, Sửa, Xóa)
